<body><div class="w"><header><img src="icon.svg" alt="HopDrop"><a href="/">HopDrop</a></header>
<h1>تواصل معنا · Contact us</h1>
<p>اكتب لنا ملاحظتك أو اقتراحك أو مشكلتك وسنرد عليك بالبريد. · Send us feedback, ideas or issues and we will reply by email.</p>
<form id="cf"><label for="n">الاسم · Name</label><input id="n" name="name" required maxlength="80" autocomplete="name">
<label for="e">البريد الإلكتروني · Email</label><input id="e" name="email" type="email" required maxlength="120" autocomplete="email" dir="ltr">
<label for="m">رسالتك · Message</label><textarea id="m" name="message" rows="6" required maxlength="3000"></textarea>
<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<button type="submit">إرسال · Send</button><div id="st" role="status"></div></form>
<p style="margin-top:20px">أو راسلنا مباشرة · Or email us: <a href="mailto:salemaymen814@gmail.com">salemaymen814@gmail.com</a></p>
<script>
const f=document.getElementById('cf'),st=document.getElementById('st');
f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');const d=Object.fromEntries(new FormData(f));if(d._honey)return;
b.disabled=true;st.textContent='جارٍ الإرسال… Sending…';
try{const r=await fetch('https://formsubmit.co/ajax/salemaymen814@gmail.com',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({name:d.name,email:d.email,message:d.message,_subject:'HopDrop contact: '+d.name,_replyto:d.email,_template:'table'})});
const j=await r.json();if(r.ok&&(j.success===true||j.success==='true')){f.reset();st.textContent='✓ تم الإرسال، شكراً لك! Message sent, thank you!'}else throw 0}
catch(_){st.innerHTML='تعذّر الإرسال الآن. راسلنا مباشرة · Could not send. Email us: <a href="mailto:salemaymen814@gmail.com">salemaymen814@gmail.com</a>'}
b.disabled=false});
</script>
